<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | PROK Studio</title>
    <link rel="icon" type="image/png" href="PROK_2.png">
    <style>
        /* Убираем отступы по краям страницы */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
        }

        /* Прилипающая шапка */
        .header {
            position: sticky;      /* делает шапку "липкой" */
            top: 0;                /* прилипает к самому верху */
            background-color: #000; /* чёрный фон */
            display: flex;          /* элементы в ряд */
            align-items: center;    /* по центру по высоте */
            gap: 20px;              /* расстояние между логотипами */
            padding: 15px 30px;
            z-index: 1000;          /* чтобы была поверх всего */
        }

        /* Размер логотипов */
        .header img {
            height: 30px;
        }

        /* Чтобы было что прокручивать (для примера) */
        .content {
            padding: 30px;
            height: 2000px;
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <div class="header">
        <img src="PROK_3.png" alt="Логотип 1">
        <!-- Можешь добавить ещё логотипы: -->
        <!-- <img src="ВТОРАЯ_КАРТИНКА.png" alt="Логотип 2"> -->
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="content">
        <h1>Привет! Это мой первый сайт 🚀</h1>
        <p>Он работает на GitHub Pages, и это бесплатно!</p>
        <p>Крути страницу вниз — шапка останется наверху 👆</p>
    </div>

</body>
</html>
