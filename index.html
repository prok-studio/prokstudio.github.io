<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
        }

        /* Прилипающая шапка */
        .header {
            position: sticky;
            top: 0;
            background-color: #000;
            display: flex;        /* логотип и текст в один ряд */
            align-items: center;  /* выравниваем по центру по высоте */
            gap: 10px;            /* расстояние между лого и текстом */
            padding: 15px 30px;
            z-index: 1000;
        }

        /* Размер логотипа */
        .header img {
            height: 100px;
        }

        /* Название сайта */
        .header .site-name {
            font-size: 18px;
            font-weight: bold;
        }

        .content {
            padding: 30px;
            height: 2000px;
        }
    </style>
</head>
<body>

    <!-- ШАПКА: логотип + название рядом -->
    <div class="header">
        <img src="PROK_3.png" alt="Логотип">
        <span class="site-name">Home | PROK Studio</span>
    </div>

    <!-- КОНТЕНТ -->
    <div class="content">
        <h1>Привет! Это мой первый сайт 🚀</h1>
        <p>Крути вниз — шапка с логотипом останется наверху 👆</p>
    </div>

</body>
</html>
